# Application Configuration for app_ble_sensor

# GPIO & System
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# Enable Audio & Digital Microphone (DMIC) Subsystems
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# LSM6DSL IMU Sensor Output Data Rates (52Hz - Power ON Accel & Gyro)
CONFIG_LSM6DSL_ACCEL_ODR=3
CONFIG_LSM6DSL_GYRO_ODR=3

# Bluetooth Stack & Device Name
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="se3dstudio_imu_01"

# BLE Throughput, MTU, and TX Buffer Optimizations
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_BUF_EVT_RX_COUNT=35
CONFIG_BT_CONN_TX_MAX=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# Enable Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Disable Bootloader, MCUboot, DFU, OTA, and MCUMGR options
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_MCUBOOT_BOOTUTIL_LIB=n
CONFIG_MCUBOOT_IMG_MANAGER=n
CONFIG_IMG_MANAGER=n
CONFIG_MCUMGR=n
CONFIG_DFU_TARGET=n
CONFIG_UPDATEHUB=n
CONFIG_HAWKBIT=n

# Build UF2 binary for direct drag-and-drop / copying to board
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_USE_DT_CODE_PARTITION=y
