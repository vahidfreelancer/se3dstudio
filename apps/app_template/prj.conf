# Core Zephyr Configurations for Seeed Studio XIAO nRF52840 Sense Plus

# Enable Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y

# Enable RTT logging
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# Enable GPIO for toggling the user LED
CONFIG_GPIO=y

# Enable I2C and Sensors for IMU driver interaction
CONFIG_I2C=y
CONFIG_SENSOR=y

# Configure System Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1

# Enable ADC
CONFIG_ADC=y

# Enable PWM
CONFIG_PWM=y

# Enable Counter (for RTC/Timer purposes)
CONFIG_COUNTER=y

# Enable Watchdog
CONFIG_WATCHDOG=y

# Enable Flash drivers
CONFIG_FLASH=y

# Enable Entropy Generator (for RNG)
CONFIG_ENTROPY_GENERATOR=y

# Enable Power Management (with Device PM)
CONFIG_PM=y
CONFIG_PM_DEVICE=y

