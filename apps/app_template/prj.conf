# Core Zephyr Configurations for Seeed Studio XIAO nRF52840 Sense Plus

# Enable Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y

# Enable RTT logging
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# Enable GPIO for toggling the user LED
CONFIG_GPIO=y

# Enable I2C and Sensors for IMU driver interaction
CONFIG_I2C=y
CONFIG_SENSOR=y

# Configure System Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1

# Enable ADC
CONFIG_ADC=y

# Enable PWM
CONFIG_PWM=y

# Enable Counter (for RTC/Timer purposes)
CONFIG_COUNTER=y

# Enable Watchdog
CONFIG_WATCHDOG=y

# Enable Flash drivers
CONFIG_FLASH=y

# Enable Entropy Generator (for RNG)
CONFIG_ENTROPY_GENERATOR=y

# Power Management Kconfig disabled (using direct SoC registers where needed)
# CONFIG_PM is not supported by target SoC in this configuration

# UART Interrupt Driven Mode
CONFIG_UART_INTERRUPT_DRIVEN=y

# Enable SPI
CONFIG_SPI=y

# Enable I2S
CONFIG_I2S=y

# Enable Bluetooth Stack (Peripheral Mode)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO_BLE_DEV"

# Enable USB Device Stack & CDC ACM
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_PRODUCT="XIAO USB CDC"
CONFIG_UART_LINE_CTRL=y

# Enable NFC Tag Emulation Library (NCS specific)
CONFIG_NFC_T2T_NRFXLIB=y
CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_URI_MSG=y
CONFIG_NFC_NDEF_URI_REC=y

# Enable Audio & Digital Microphone (DMIC) subsystems for PDM microphone
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y



